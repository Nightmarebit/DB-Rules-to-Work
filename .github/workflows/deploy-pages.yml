name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      custom_domain_root:
        description: 'Deploy for custom domain at root (site at https://yourdomain.com/)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event.inputs.custom_domain_root }}" = "true" ]; then
            export BASE_PATH=""
            export NEXT_PUBLIC_BASE_PATH=""
          fi
          npm run build

      - name: Fix manifest for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          ROOT_DEPLOY="${{ github.event.inputs.custom_domain_root == 'true' }}"
          MANIFEST="out/manifest.json"
          if [ -f "$MANIFEST" ]; then
            if [ "$ROOT_DEPLOY" = "true" ]; then
              sed -i 's|"start_url": "./"|"start_url": "/"|g' "$MANIFEST"
            else
              sed -i "s|\"start_url\": \"/\"|\"start_url\": \"/$REPO/\"|g" "$MANIFEST"
              sed -i "s|\"start_url\": \"./\"|\"start_url\": \"/$REPO/\"|g" "$MANIFEST"
            fi
            # Icons: absolute /icons/ -> relative so they work under .../REPO/
            sed -i 's|"/icons/|"icons/|g' "$MANIFEST"
          fi

      - name: Prepare artifact (project site)
        if: github.event.inputs.custom_domain_root != 'true'
        run: |
          REPO="${{ github.event.repository.name }}"
          mkdir -p deploy/"$REPO"
          cp -r out/* deploy/"$REPO"/

      - name: Prepare artifact (custom domain root)
        if: github.event.inputs.custom_domain_root == 'true'
        run: |
          mkdir -p deploy
          cp -r out/* deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
